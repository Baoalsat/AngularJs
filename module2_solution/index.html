<!DOCTYPE html>
<html lang="en" ng-app="ShoppingListCheckOff">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../module2_solution/js/angular.min.js"></script>
    <script src="../module2_solution/js/app.js"></script>
     <link rel = 'stylesheet' href = 'styles/bootstrap.min.css'>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=grocery" />
      <link rel="stylesheet" href="style.css">
    <title>module2 Solution</title>
</head>
<body>

<div class="container">
  <div class="row">
  <div class="d-flex justify-content-center">
    <!-- First main column -->
    <div class="col-md-3">
      <!-- Stack vertically -->
      <div class="d-flex flex-column justify-content-between h-100">
        <div class=" bg-success-subtle text-black p-2">
                            <h1>Searching to buy</h1>
    <div id="list" ng-controller="ToBuyController as list">
    <input type="text" ng-model="list.itemName" placeholder="item name">
    <input type="text" ng-model="list.itemQuantity" placeholder="quantity">
    <button ng-click="list.addItem()">Add Item</button>
    
    <!-- Error Message Display -->
    <div ng-if="list.errorMessage" class="error text-danger">
      {{list.errorMessage}}
    </div>
          
        
        <!-- This one should align horizontally with third col -->
      <div class="bg-success text-warning p-2 align-with-last">
          <h2>List your goods</h2>
        <ol class="big-number">
          <li ng-repeat="item in list.items">
            <div id="text">
              <i class="material-symbols-outlined">grocery</i>
              {{item.quantity}} of {{item.name}}
            </div>
            <button ng-click="list.removeItem($index)">Remove item</button>
           
            <button ng-click="list.ToBuy($index)">Tobuy</button>
            
            
          </li>
        </ol>
        <div>{{ list.getMessage() }}</div>
      </div>
    </div>
    </div>
    </div>
</div>

    <!-- Third main column -->
    <div class="col-md-3 d-flex align-items-end">
      <div class="bg-danger text-white p-2" id="last-col">
        <h2>Already Bought</h2>
        <div id="bought" ng-controller="AlreadyBoughtController as bought">
          <ol>
            <li class="custom-text" ng-repeat="item in bought.items">
              {{item.quantity}} of {{item.name}}
            </li>
          </ol>
        </div>
      </div>
    </div>

  
</div>
</div>

</body>
</html>
